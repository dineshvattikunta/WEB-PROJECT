<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern E-Commerce</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        :root {
            --primary-color: #ff9900;
            --hover-color: #007185;
            --bg-dark: #121212;
            --bg-light: #f5f5f5;
            --text-dark: white;
            --text-light: black;
            --card-dark: #1e1e1e;
            --card-light: white;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-dark);
            transition: 0.3s;
        }

        .light-mode {
            background: var(--bg-light);
            color: var(--text-light);
        }

        .light-mode .header, 
        .light-mode .cart, 
        .light-mode .footer, 
        .light-mode .product {
            background: var(--card-light);
            color: var(--text-light);
        }

        .header {
            background: var(--card-dark);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            border-bottom: 3px solid var(--primary-color);
        }

        .header button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .header button:hover {
            background: var(--hover-color);
        }

        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
            max-width: 1200px;
        }

        .product {
            background: var(--card-dark);
            padding: 20px;
            border-radius: 15px;
            transition: 0.3s;
            cursor: pointer;
            width: 250px;
            text-align: center;
        }

        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 153, 0, 0.3);
        }

        .product img {
            width: 100%;
            height: 150px;
            border-radius: 10px;
        }

        .product button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .product button:hover {
            background: var(--hover-color);
        }

        .cart {
            position: fixed;
            top: 50px;
            right: -350px;
            background: var(--card-dark);
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            height: 400px;
            overflow-y: auto;
            transition: right 0.3s;
            box-shadow: -5px 0 10px rgba(255, 153, 0, 0.2);
        }

        .cart.show {
            right: 20px;
        }

        .cart h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .cart ul {
            list-style: none;
            padding: 0;
        }

        .cart ul li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .remove-btn {
            background: #ff4646;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #d93030;
        }

        .cart-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--primary-color);
            padding: 12px 20px;
            border-radius: 50px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .cart-toggle:hover {
            background: var(--hover-color);
        }
    </style>
</head>
<body>

    <div class="header">
        DNPH MART 🛍 
        <button onclick="toggleTheme()">🌗 Toggle Mode</button>
    </div>

    <div class="product-container">
        <div class="product">
            <img src="https://cdn.dotpe.in/longtail/item_thumbnails/8813471/30OtCHbY-800-800.webp" alt="Nike Shoes">
            <h3>Nike Shoes - ₹9,999</h3>
            <button onclick="addToCart('Nike Shoes', 9999)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://darlingretail.com/cdn/shop/products/r1594_Starlight_PDP_Image_Position-1A_Avail__en-IN_800x.jpg?v=1662987257" alt="iPhone 14">
            <h3>iPhone 14 - ₹79,999</h3>
            <button onclick="addToCart('iPhone 14', 79999)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://www.myimaginestore.com/media/catalog/product/cache/4a48ac28cbb6e9c41470e5be5a6d3043/a/i/air-gold_2.jpeg" alt="MacBook">
            <h3>MacBook Air - ₹1,19,999</h3>
            <button onclick="addToCart('MacBook Air', 119999)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://sathya.in/media/90828/catalog/Samsung%2055%20Crystal%204K%20UHD%20Smart%20TV02.jpg" alt="Samsung TV">
            <h3>Samsung TV - ₹45,999</h3>
            <button onclick="addToCart('Samsung TV', 45999)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://sathya.in/media/92077/catalog/03%20(37).jpg" alt="AirPods">
            <h3>AirPods Pro - ₹24,999</h3>
            <button onclick="addToCart('AirPods Pro', 24999)">Add to Cart</button>
        </div>

        <div class="product">
            <img src="https://www.apple.com/newsroom/images/2024/09/introducing-apple-watch-series-10/article/Apple-Watch-Series-10-watch-face-Flux-240909_inline.jpg.large.jpg" alt="Smart Watch">
            <h3>Smart Watch - ₹12,999</h3>
            <button onclick="addToCart('Smart Watch', 12999)">Add to Cart</button>
        </div>
    </div>

    <div class="cart" id="cart">
        <h2>Your Cart</h2>
        <ul id="cart-items"></ul>
        <div>Total: ₹<span id="total">0</span></div>
    </div>

    <button class="cart-toggle" onclick="toggleCart()">🛒 View Cart</button>

    <script>
        let cart = [];
        function addToCart(product, price) { cart.push({ product, price }); updateCart(); }
        function updateCart() { document.getElementById("cart-items").innerHTML = cart.map((item, index) => `<li>${item.product} - ₹${item.price} <button class="remove-btn" onclick="removeItem(${index})">X</button></li>`).join(""); document.getElementById("total").textContent = cart.reduce((acc, item) => acc + item.price, 0); }
        function removeItem(index) { cart.splice(index, 1); updateCart(); }
        function toggleCart() { document.getElementById("cart").classList.toggle("show"); }
        function toggleTheme() { document.body.classList.toggle("light-mode"); }
    </script>

</body>
</html>
